<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration Bilocost</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#182632;--line:#304554;--accent:#f4b942;--text:#f5f7f8;--muted:#a9bac5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
main{width:min(100%,440px);padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
h1{margin:0 0 8px;font-size:25px}p{color:var(--muted);line-height:1.5}label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#101820;color:var(--text);font:inherit}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:var(--accent);color:#171717;font-weight:700;font-size:15px;cursor:pointer}
button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
#status{padding:12px;border-radius:9px;background:#101820;overflow-wrap:anywhere} [hidden]{display:none!important}
</style>
<script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
<script src="/__/firebase/init.js"></script>
</head>
<body><main>
<h1>Bilocost — Administration</h1>
<p>Connectez-vous avec le compte d’administration autorisé. Un compte utilisateur ordinaire ne donne aucun accès administratif.</p>
<section id="login">
<label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn">Se connecter</button>
</section>
<section id="account" hidden>
<p id="identity"></p><p id="status" role="status" aria-live="polite">Vérification des autorisations…</p>
<button id="logoutBtn" class="secondary">Se déconnecter</button>
</section>
<p id="error" role="alert" aria-live="polite"></p>
</main>
<script>
(function(){
 const login=document.getElementById("login"),account=document.getElementById("account");
 const status=document.getElementById("status"),error=document.getElementById("error");
 const loginBtn=document.getElementById("loginBtn");
 if(!window.firebase||!firebase.apps||!firebase.apps.length){error.textContent="Le service de connexion Firebase n’est pas initialisé sur cet hébergement.";loginBtn.disabled=true;return;}
 const auth=firebase.auth();
 function showError(message){error.textContent=message||"Connexion impossible. Réessayez.";}
 auth.onAuthStateChanged(async user=>{
   error.textContent="";
   if(!user){login.hidden=false;account.hidden=true;return;}
   login.hidden=true;account.hidden=false;
   document.getElementById("identity").textContent="Compte connecté : "+(user.email||user.uid);
   status.textContent="Vérification des droits administrateur…";
   try{
     const token=await user.getIdTokenResult(true);
     if(token.claims.admin===true){
       status.textContent="Accès administrateur confirmé. Le tableau de bord sera activé après configuration des modules d’administration.";
     }else{
       status.textContent="Ce compte n’a pas le rôle administrateur. Aucun accès aux données d’administration n’est accordé.";
       await auth.signOut();
     }
   }catch(e){status.textContent="Impossible de vérifier les autorisations.";showError(e.message);}
 });
 loginBtn.addEventListener("click",async()=>{
   showError("");loginBtn.disabled=true;
   try{await auth.signInWithEmailAndPassword(document.getElementById("email").value.trim(),document.getElementById("password").value);}
   catch(e){showError("Connexion refusée : "+(e.code||e.message));}
   finally{loginBtn.disabled=false;}
 });
 document.getElementById("logoutBtn").addEventListener("click",()=>auth.signOut());
})();
</script></body></html>
