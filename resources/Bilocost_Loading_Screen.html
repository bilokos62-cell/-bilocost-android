<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3b2c">
  <title>Bilocost – Chargement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;1,900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b3b2c;
      --bg-deep: #072e22;
      --bg-pill: #07291f;
      --line: #145a44;
      --green: #4ade80;
      --green-soft: #86efac;
      --white: #ffffff;
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --duration: 2400ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg-deep);
      color: var(--white);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Écran ---------- */
    .screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 390px;
      height: min(780px, calc(100dvh - 32px));
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(120% 60% at 50% 38%, rgba(74, 222, 128, .14), transparent 70%),
        var(--bg);
      border: 1px solid var(--line);
      border-radius: 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .45);
    }

    @media (max-width: 430px) {
      body { padding: 0; }
      .screen { max-width: none; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    }

    /* ---------- Contenu central ---------- */
    .splash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .logo {
      width: 104px;
      height: 104px;
      margin-bottom: 28px;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .45));
      animation: logo-in 700ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }

    @keyframes logo-in {
      from { opacity: 0; transform: translateY(10px) scale(.92); }
      to   { opacity: 1; transform: none; }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .brand h1 {
      font-size: 2.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: .06em;
      line-height: 1;
      text-transform: uppercase;
    }

    .brand h1 span { color: var(--green); }

    .brand .wedge {
      width: 208px;
      height: 14px;
      margin-top: 8px;
      background: var(--white);
      clip-path: polygon(0 75%, 100% 0, 100% 100%, 0 100%);
    }

    /* ---------- Carrousel d'icônes ---------- */
    .icons {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: rgba(7, 41, 31, .8);
      border: 1px solid rgba(52, 211, 153, .2);
      border-radius: 999px;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      color: var(--green);
      opacity: .35;
      transform: scale(.9);
      transition: opacity .25s ease, transform .25s ease, color .25s ease;
    }

    .icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon.is-active {
      color: var(--white);
      opacity: 1;
      transform: scale(1.25) translateY(-2px);
    }

    /* ---------- Progression ---------- */
    .progress {
      width: 208px;
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: var(--green);
      border-radius: inherit;
      transform: scaleX(0);
      transform-origin: left;
    }

    .progress-bar { animation: fill var(--duration) ease-in-out infinite; }

    @keyframes fill {
      0%   { transform: scaleX(0); transform-origin: left; }
      50%  { transform: scaleX(1); transform-origin: left; }
      50.01% { transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }

    .status {
      margin-top: 14px;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(134, 239, 172, .85);
    }

    /* ---------- Pied de page ---------- */
    .version {
      padding-bottom: 8px;
      font-size: .625rem;
      letter-spacing: .08em;
      color: rgba(74, 222, 128, .5);
    }

    /* ---------- Accessibilité ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
