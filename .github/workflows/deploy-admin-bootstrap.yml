name: Deploy Bilocost admin bootstrap function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilocost-admin-bootstrap-deploy
  cancel-in-progress: false

jobs:
  deploy-admin-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy only the owner bootstrap callable
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only functions:provisionDeveloperAdmin --project bilocost-a8136
