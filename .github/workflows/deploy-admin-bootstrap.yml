name: Deploy Bilocost admin bootstrap function

on:
  push:
    branches: [main]
    paths:
      - "functions/index.js"
      - "functions/package.json"
      - "firebase.json"
      - ".github/workflows/deploy-admin-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilocost-admin-bootstrap-deploy
  cancel-in-progress: false

jobs:
  deploy-admin-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}" > "$GOOGLE_APPLICATION_CREDENTIALS"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy only the owner bootstrap callable
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: firebase deploy --only functions:provisionDeveloperAdmin --project bilocost-a8136 --non-interactive
