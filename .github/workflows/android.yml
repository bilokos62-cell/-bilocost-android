name: Build Bilocost Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inject shared Bilocost patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          messaging = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          listing_location = Path("listing-location.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          theme_rewards = Path("theme-rewards.js").read_text(encoding="utf-8")
          html = html[:script_end] + "\n" + messaging + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + listing_location + "\n" + ui_refinement + "\n" + theme_rewards + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging, services, and secure delivery OTP modules injected for Android.")
          PY

      - name: Validate Bilocost source and integrations
        run: npm run build
      - name: Prepare web files
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          # The storefront references this local brand image; include it in the WebView bundle.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Include optional PWA assets when present, so web and Android use the same source.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          # Fail early if an HTML-referenced local brand image is missing.
          test -s www/IMG-20261024-WA0000.jpg
          # Add the brand mark to the Android-only WebView bundle.
          cp resources/IMG_20261104_114004_803.jpg www/bilocost-loader-logo.jpg
          test -s www/bilocost-loader-logo.jpg
          # Use the current Bilocost loading animation, not the older draft clip.
          test -s resources/Bilocost_Loading_Screen.mp4
          cp resources/Bilocost_Loading_Screen.mp4 www/bilocost-launch.mp4
          test -s www/bilocost-launch.mp4
          # Inject the animated launch screen into Android output only (never into Firebase Hosting).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          style = r"""
          <style id="bilocost-native-loader-style">
          #bilocost-native-loader{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#075d36 0%,#023a25 44%,#001b13 100%);color:#fff;opacity:1;transition:opacity .48s ease}
          #bilocost-native-loader .bl-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#001b13}
          #bilocost-native-loader .bl-video[hidden]{display:none}
          #bilocost-native-loader.bl-video-active .bl-wrap,#bilocost-native-loader.bl-video-active:before,#bilocost-native-loader.bl-video-active:after{display:none}
          #bilocost-native-loader.bl-video-pending .bl-wrap,#bilocost-native-loader.bl-video-pending:before,#bilocost-native-loader.bl-video-pending:after{display:none}
          #bilocost-native-loader:before,#bilocost-native-loader:after{content:"";position:absolute;width:72vw;height:72vw;max-width:520px;max-height:520px;border:1px solid rgba(74,255,145,.12);border-radius:50%;animation:bilocost-loader-orbit 7s linear infinite}
          #bilocost-native-loader:after{width:105vw;height:105vw;max-width:760px;max-height:760px;animation-direction:reverse;opacity:.55}
          #bilocost-native-loader .bl-wrap{position:relative;z-index:1;width:min(88vw,420px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px}
          #bilocost-native-loader .bl-map{width:min(64vw,270px);height:auto;overflow:visible;filter:drop-shadow(0 0 13px rgba(0,255,112,.35));animation:bilocost-loader-float 3s ease-in-out infinite}
          #bilocost-native-loader .bl-map-line{fill:rgba(0,255,117,.07);stroke:#39ff83;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:bilocost-loader-draw 2.25s ease-out forwards}
          #bilocost-native-loader .bl-brand{display:flex;flex-direction:column;align-items:center;margin-top:-4px}
          #bilocost-native-loader .bl-logo{width:76px;height:76px;object-fit:contain;border-radius:19px;filter:drop-shadow(0 0 15px rgba(65,255,123,.5));animation:bilocost-loader-pop .65s 1.7s both}
          #bilocost-native-loader .bl-name{font:italic 800 29px/1.1 system-ui,sans-serif;letter-spacing:-.7px;margin-top:7px;text-shadow:0 2px 12px #00a64f}
          #bilocost-native-loader .bl-tag{font:700 10px/1.5 system-ui,sans-serif;letter-spacing:2.3px;color:#a8f6c6;margin-top:6px}
          #bilocost-native-loader .bl-star{position:absolute;top:9%;left:22%;color:#ffe45e;font-size:23px;text-shadow:0 0 12px #ffe45e;animation:bilocost-loader-twinkle 1.2s ease-in-out infinite alternate}
          #bilocost-native-loader .bl-flag{position:absolute;inset:0;pointer-events:none}
          #bilocost-native-loader .bl-steps{display:flex;justify-content:center;gap:9px;margin-top:31px;width:100%}
          #bilocost-native-loader .bl-step{width:29px;height:29px;border:1px solid rgba(102,255,168,.3);border-radius:50%;display:grid;place-items:center;background:rgba(0,40,25,.55);color:#7cbd98;font:700 14px system-ui,sans-serif;animation:bilocost-loader-step 1.05s ease-in-out infinite}
          #bilocost-native-loader .bl-step:nth-child(2){animation-delay:.15s}#bilocost-native-loader .bl-step:nth-child(3){animation-delay:.3s}#bilocost-native-loader .bl-step:nth-child(4){animation-delay:.45s}#bilocost-native-loader .bl-step:nth-child(5){animation-delay:.6s}#bilocost-native-loader .bl-step:nth-child(6){animation-delay:.75s}
          #bilocost-native-loader .bl-track{height:4px;width:min(74vw,300px);border-radius:10px;background:rgba(150,255,190,.2);overflow:hidden;margin-top:14px;box-shadow:0 0 10px rgba(0,255,115,.16)}
          #bilocost-native-loader .bl-fill{height:100%;width:32%;border-radius:10px;background:linear-gradient(90deg,#25b85f,#baff65);box-shadow:0 0 10px #4cff91;animation:bilocost-loader-progress 1.15s ease-in-out infinite alternate}
          #bilocost-native-loader .bl-caption{font:500 11px/1.4 system-ui,sans-serif;letter-spacing:.5px;color:#b8e9ca;margin-top:12px}
          #bilocost-native-loader.bl-out{opacity:0;pointer-events:none}
          @keyframes bilocost-loader-draw{to{stroke-dashoffset:0}}@keyframes bilocost-loader-progress{from{transform:translateX(-25%)}to{transform:translateX(220%)}}@keyframes bilocost-loader-float{50%{transform:translateY(-5px)}}@keyframes bilocost-loader-pop{0%{opacity:0;transform:scale(.65)}100%{opacity:1;transform:scale(1)}}@keyframes bilocost-loader-step{0%,100%{color:#74ad8b;border-color:rgba(102,255,168,.25);box-shadow:none;transform:scale(.92)}45%{color:#fff;border-color:#51ff9a;background:rgba(0,190,85,.4);box-shadow:0 0 13px rgba(43,255,131,.7);transform:scale(1.12)}}@keyframes bilocost-loader-twinkle{to{opacity:.4;transform:scale(.8)}}@keyframes bilocost-loader-orbit{to{transform:rotate(360deg)}}
          @media(prefers-reduced-motion:reduce){#bilocost-native-loader *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
          </style>
          """
          script = r"""
          <script id="bilocost-native-loader-script">
          (() => {
            const cap = window.Capacitor;
            if (!cap || typeof cap.getPlatform !== "function" || cap.getPlatform() !== "android") return;
            if (document.getElementById("bilocost-native-loader")) return;
            const layer = document.createElement("div");
            layer.id = "bilocost-native-loader";
            layer.setAttribute("role", "status");
            layer.setAttribute("aria-label", "Chargement de Bilocost");
            layer.innerHTML = `
              <div class="bl-wrap">
                <svg class="bl-map" viewBox="0 0 240 250" role="img" aria-label="Carte de la République démocratique du Congo">
                  <defs><clipPath id="bilocost-drc-clip"><path d="M83 9 111 15 128 27 153 24 172 42 193 49 205 72 226 84 216 106 224 128 205 143 198 166 180 176 169 202 151 213 145 239 123 230 108 242 89 221 68 211 59 190 39 177 34 155 19 139 31 117 24 96 43 80 42 58 62 45 69 25Z"/></clipPath></defs>
                  <path class="bl-map-line" d="M83 9 111 15 128 27 153 24 172 42 193 49 205 72 226 84 216 106 224 128 205 143 198 166 180 176 169 202 151 213 145 239 123 230 108 242 89 221 68 211 59 190 39 177 34 155 19 139 31 117 24 96 43 80 42 58 62 45 69 25Z"/>
                  <g clip-path="url(#bilocost-drc-clip)"><path d="M5 194 240 42" stroke="#ffd84a" stroke-width="17"/><path d="M5 194 240 42" stroke="#e83232" stroke-width="9"/></g>
                </svg>
                <span class="bl-star">★</span>
                <div class="bl-brand">
                  <img class="bl-logo" src="bilocost-loader-logo.jpg" alt="Bilocost">
                  <div class="bl-name">Bilocost</div>
                  <div class="bl-tag">ACHAT À BAS PRIX</div>
                </div>
                <div class="bl-steps" aria-hidden="true">
                  <span class="bl-step">▣</span><span class="bl-step">ϟ</span><span class="bl-step">▤</span><span class="bl-step">▧</span><span class="bl-step">⌂</span><span class="bl-step">✓</span>
                </div>
                <div class="bl-track"><div class="bl-fill"></div></div>
                <div class="bl-caption">Préparation de votre espace Bilocost…</div>
              </div>`;
            const video = document.createElement("video");
            video.className = "bl-video";
            video.src = "bilocost-launch.mp4";
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = "auto";
            video.loop = false;
            video.setAttribute("aria-hidden", "true");
            layer.classList.add("bl-video-pending");
            video.addEventListener("loadeddata", () => {
              layer.classList.remove("bl-video-pending");
              layer.classList.add("bl-video-active");
            }, { once: true });
            layer.insertBefore(video, layer.firstChild);
            document.body.appendChild(layer);
            let closed = false;
            let videoFinished = false;
            let appReady = false;
            let startupTimedOut = false;
            const close = () => {
              if (closed) return;
              closed = true;
              layer.classList.add("bl-out");
              window.setTimeout(() => layer.remove(), 520);
            };
            const finishIfReady = () => {
              if (videoFinished && appReady) close();
            };
            video.addEventListener("ended", () => {
              videoFinished = true;
              finishIfReady();
            }, { once: true });
            video.addEventListener("error", () => {
              video.remove();
              layer.classList.remove("bl-video-pending");
              videoFinished = true;
              finishIfReady();
            }, { once: true });
            const readyForApp = () => {
              const view = document.getElementById("view");
              const interfaceReady = !!view && (view.childElementCount > 0 || view.textContent.trim().length > 0);
              return document.readyState !== "loading" && interfaceReady;
            };
            const startedAt = Date.now();
            let readySince = 0;
            const waitUntilReady = () => {
              if (closed) return;
              if (readyForApp()) {
                if (!readySince) readySince = Date.now();
                if (Date.now() - readySince >= 700) {
                  appReady = true;
                  finishIfReady();
                }
              } else {
                readySince = 0;
              }
              if (Date.now() - startedAt >= 15000 && !startupTimedOut) {
                startupTimedOut = true;
                if (!videoFinished) {
                  video.pause();
                  video.remove();
                  layer.classList.remove("bl-video-pending");
                  videoFinished = true;
                }
                const caption = layer.querySelector(".bl-caption");
                if (caption) caption.textContent = "Le démarrage prend plus de temps que prévu. Vos données restent protégées.";
                const retry = document.createElement("button");
                retry.type = "button";
                retry.className = "bl-retry";
                retry.textContent = "Réessayer";
                retry.addEventListener("click", () => window.location.reload(), { once: true });
                layer.querySelector(".bl-wrap")?.appendChild(retry);
                finishIfReady();
              }
              window.setTimeout(waitUntilReady, 180);
            };
            const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (reduced) {
              video.remove();
              videoFinished = true;
            } else {
              video.play().then(() => {
                layer.classList.add("bl-video-active");
              }).catch(() => {
                video.remove();
                layer.classList.remove("bl-video-pending");
                videoFinished = true;
                finishIfReady();
              });
            }
            waitUntilReady();
            window.addEventListener("pagehide", close, { once: true });
          })();
          </script>
          """
          if "bilocost-native-loader-style" not in html:
              if "</head>" not in html: raise SystemExit("Android loader: </head> missing")
              html = html.replace("</head>", style + "\n</head>", 1)
          if "bilocost-native-loader-script" not in html:
              if "</body>" not in html: raise SystemExit("Android loader: </body> missing")
              html = html.replace("</body>", script + "\n</body>", 1)
          p.write_text(html, encoding="utf-8")
          print("Android-only Bilocost animated launch screen injected.")
          PY

      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor and add Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bilocost.app",
            "appName": "Bilocost",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Install Bilocost launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("resources/bilocost-app-icon.jpg")
          if not source.is_file():
              raise SystemExit("Bilocost app icon is missing: resources/bilocost-app-icon.jpg")
          from PIL import Image, ImageDraw, ImageFilter
          image = Image.open(source).convert("RGB")
          # Clean the photographed rounded-square edge: replace the black corner
          # background with a sampled Bilocost green, then antialias the contour.
          w, h = image.size
          side = min(w, h)
          image = image.crop(((w-side)//2, (h-side)//2, (w-side)//2+side, (h-side)//2+side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          bg = image.getpixel((512, 12))
          scale = 4
          mask_hi = Image.new("L", (1024*scale, 1024*scale), 0)
          ImageDraw.Draw(mask_hi).rounded_rectangle((0, 0, 1024*scale-1, 1024*scale-1), radius=176*scale, fill=255)
          mask = mask_hi.resize((1024, 1024), Image.Resampling.LANCZOS)
          clean = Image.new("RGB", (1024, 1024), bg)
          clean.paste(image, (0, 0), mask)
          clean = clean.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for density, px in sizes.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = clean.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          # Remove adaptive XML that could fall back to the Android robot if its
          # foreground drawable is unavailable on a particular Android build.
          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  (adaptive / name).unlink(missing_ok=True)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          application.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
          application.set(f"{{{android_ns}}}roundIcon", "@mipmap/ic_launcher_round")
          admob_meta = application.find("meta-data[@android:name='com.google.android.gms.ads.APPLICATION_ID']", {"android": android_ns})
          if admob_meta is None:
              admob_meta = ET.SubElement(application, "meta-data")
          admob_meta.set(f"{{{android_ns}}}name", "com.google.android.gms.ads.APPLICATION_ID")
          admob_meta.set(f"{{{android_ns}}}value", "ca-app-pub-3940256099942544~3347511713")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Use the smaller binary distribution from the direct Gradle CDN.
          # The default services.gradle.org redirect currently returns timeouts/504.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle/wrapper/gradle-wrapper.properties")
          if not p.is_file():
              raise SystemExit("Gradle wrapper properties file is missing")
          lines = [line for line in p.read_text().splitlines()
                   if not line.startswith("distributionUrl=")
                   and not line.startswith("networkTimeout=")]
          lines += [
              "distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v8.11.1/gradle-8.11.1-bin.zip",
              "networkTimeout=120000",
          ]
          p.write_text("\n".join(lines) + "\n")
          print("Gradle wrapper configured to use the Aliyun Gradle distribution mirror with 120s timeout.")
          PY
          # Prefer independent Maven Central mirrors to bypass transient 504 responses
          # from the default Maven Central -> GitHub artifact redirect.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/bilocost-maven-mirrors.gradle" <<'GRADLE'
          allprojects {
              repositories {
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
              }
          }
          GRADLE
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
