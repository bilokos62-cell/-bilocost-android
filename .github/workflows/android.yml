name: Build Bilocost Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inject shared Bilocost patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          messaging = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          html = html[:script_end] + "\n" + messaging + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + ui_refinement + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging patch injected for Android.")
          PY

      - name: Validate Bilocost source and integrations
        run: npm run build
      - name: Prepare web files
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          # The storefront references this local brand image; include it in the WebView bundle.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Include optional PWA assets when present, so web and Android use the same source.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          # Fail early if an HTML-referenced local brand image is missing.
          test -s www/IMG-20261024-WA0000.jpg
      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor and add Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bilocost.app",
            "appName": "Bilocost",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Install Bilocost launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("resources/IMG_20261104_114004_803.jpg")
          if not source.is_file():
              raise SystemExit("Bilocost brand image is missing: resources/IMG_20261104_114004_803.jpg")
          image = Image.open(source).convert("RGB")
          # Remove the photographed black corners and thin white frame.
          w, h = image.size
          image = image.crop((round(w * 0.11), round(h * 0.10),
                              round(w * 0.90), round(h * 0.89)))
          side = min(image.size)
          left = (image.width - side) // 2
          top = (image.height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for density, px in sizes.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = image.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          # Remove adaptive XML that could fall back to the Android robot if its
          # foreground drawable is unavailable on a particular Android build.
          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  (adaptive / name).unlink(missing_ok=True)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          application.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
          application.set(f"{{{android_ns}}}roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Audit generated Android manifest
        run: python3 scripts/audit-android-manifest.py android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
