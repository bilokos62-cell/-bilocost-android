name: Build Bilocost Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios.yml'
      - 'marketplace-search.js'
      - '*.js'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inject shared Bilocost patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          messaging = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          listing_location = Path("listing-location.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          home_discovery = Path("home-discovery.js").read_text(encoding="utf-8")
          html = html[:script_end] + "\n" + messaging + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + listing_location + "\n" + ui_refinement + "\n" + home_discovery + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging, services, and secure delivery OTP modules injected for Android.")
          PY

      - name: Inject responsive tablet and desktop layout
        run: python3 scripts/inject-responsive-layout.py

      - name: Validate Bilocost source and integrations
        run: |
          npm run build
          node --check home-discovery.js
      - name: Prepare web files
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          old = "<p><b>Contact.</b> Le canal officiel de contact relatif aux données personnelles doit être renseigné et vérifié par Bilocost avant le lancement public.</p>"
          new = "<p><b>Contact relatif aux données personnelles.</b> Pour exercer vos demandes d’accès, de correction ou de suppression, contactez Bilocost à <a href=\"mailto:josephkanku007@gmail.com\">josephkanku007@gmail.com</a>. Les demandes sont traitées par le responsable de la plateforme.</p>"
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit("Privacy contact placeholder not found; refusing an incomplete privacy policy")
          p.write_text(html, encoding="utf-8")
          PY
          cp responsive-layout.css www/responsive-layout.css
          # The storefront references this local brand image; include it in the WebView bundle.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Include optional PWA assets when present, so web and Android use the same source.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          # Fail early if an HTML-referenced local brand image is missing.
          test -s www/IMG-20261024-WA0000.jpg
          # Add the brand mark to the Android-only WebView bundle.
          cp resources/bilocost-app-icon.jpg www/bilocost-loader-logo.jpg
          test -s www/bilocost-loader-logo.jpg
          # Replace the legacy green/video splash with the new white native animation.
          python3 scripts/inject-android-splash.py


      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor and add Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bilocost.app",
            "appName": "Bilocost",
            "webDir": "www"
          }
          EOF
          npx cap add android
          # Match the native launch window to the Bilocost reference green before the WebView appears.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          res = Path("android/app/src/main/res")
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "colors.xml"
          colors.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bilocost_launch_white">#FFFFFF</color>
              <color name="bilocost_launch_black">#171717</color>
              <color name="bilocost_launch_green">#087542</color>
          </resources>
          """, encoding="utf-8")
          styles = values / "styles.xml"
          if not styles.is_file():
              raise SystemExit("Generated Android styles.xml is missing")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(styles)
          root = tree.getroot()
          settings = {
              "android:windowBackground": "#073F30",
              "android:statusBarColor": "#073F30",
              "android:navigationBarColor": "#073F30",
              "android:windowLightStatusBar": "false",
              "android:windowLightNavigationBar": "false",
          }
          # Capacitor switches from the launch theme to AppTheme.NoActionBar
          # as soon as the WebView starts. Apply the same system-bar colors to
          # BOTH themes; changing only the launch theme causes the bar to revert.
          theme_names = ("AppTheme.NoActionBarLaunch", "AppTheme.NoActionBar")
          found = set()
          for theme_name in theme_names:
              theme = next((node for node in root.findall("style") if node.get("name") == theme_name), None)
              if theme is None:
                  raise SystemExit(f"Native Android theme {theme_name} was not found")
              found.add(theme_name)
              for name, value in settings.items():
                  item = next((x for x in theme.findall("item") if x.get("name") == name), None)
                  if item is None:
                      item = ET.SubElement(theme, "item", {"name": name})
                  item.text = value
          if found != set(theme_names):
              raise SystemExit("Launch and runtime Android themes were not both configured")
          tree.write(styles, encoding="utf-8", xml_declaration=True)
          ET.parse(styles)
          PY
          # Add the Firebase Android configuration generated in Firebase Console.
          test -s google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          # Register the Google Services Gradle plugin in the generated Capacitor project.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not root.is_file() or not app.is_file():
              raise SystemExit("Generated Android Gradle files were not found")
          text = root.read_text(encoding="utf-8")
          if "com.google.gms:google-services" not in text:
              marker = "dependencies {"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("Could not find root Gradle dependencies block")
              end = text.find("}", pos)
              if end < 0:
                  raise SystemExit("Could not close root Gradle dependencies block")
              text = text[:end] + "    classpath 'com.google.gms:google-services:4.4.4'\n" + text[end:]
              root.write_text(text, encoding="utf-8")
          text = app.read_text(encoding="utf-8")
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(text, encoding="utf-8")
          PY

      - name: Configure reliable Android dependency mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          if not p.is_file():
              raise SystemExit("Generated Android settings.gradle is missing")
          text = p.read_text(encoding="utf-8")
          mirrors = [
              'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }',
              'maven { url = uri("https://maven.aliyun.com/repository/central") }',
              'maven { url = uri("https://repo.huaweicloud.com/repository/maven/") }',
          ]
          for block in ("pluginManagement", "dependencyResolutionManagement"):
              start = text.find(block + " {")
              if start < 0:
                  raise SystemExit(f"{block} block missing from settings.gradle")
              repo = text.find("repositories {", start)
              if repo < 0:
                  raise SystemExit(f"{block} repositories block missing")
              insert = repo + len("repositories {")
              additions = "\n" + "\n".join("        " + m for m in mirrors)
              if mirrors[0] not in text[repo:text.find("}", repo)]:
                  text = text[:insert] + additions + text[insert:]
          p.write_text(text, encoding="utf-8")
          print("Configured Google-hosted Maven Central, Aliyun and Huawei mirrors for plugins and dependencies.")
          PY

      - name: Install Bilocost launcher icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("resources/bilocost-app-icon.jpg")
          if not source.is_file():
              raise SystemExit("Bilocost app icon is missing: resources/bilocost-app-icon.jpg")
          from PIL import Image, ImageDraw, ImageFilter
          image = Image.open(source).convert("RGB")
          # Clean the photographed rounded-square edge: replace the black corner
          # background with a sampled Bilocost green, then antialias the contour.
          w, h = image.size
          side = min(w, h)
          image = image.crop(((w-side)//2, (h-side)//2, (w-side)//2+side, (h-side)//2+side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          bg = image.getpixel((512, 12))
          scale = 4
          mask_hi = Image.new("L", (1024*scale, 1024*scale), 0)
          ImageDraw.Draw(mask_hi).rounded_rectangle((0, 0, 1024*scale-1, 1024*scale-1), radius=176*scale, fill=255)
          mask = mask_hi.resize((1024, 1024), Image.Resampling.LANCZOS)
          clean = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          clean.paste(image.convert("RGBA"), (0, 0), mask)
          clean = clean.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for density, px in sizes.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = clean.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          # Remove adaptive XML that could fall back to the Android robot if its
          # foreground drawable is unavailable on a particular Android build.
          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  (adaptive / name).unlink(missing_ok=True)
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest)
          application = tree.getroot().find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          application.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
          application.set(f"{{{android_ns}}}roundIcon", "@mipmap/ic_launcher_round")
          admob_meta = application.find("meta-data[@android:name='com.google.android.gms.ads.APPLICATION_ID']", {"android": android_ns})
          if admob_meta is None:
              admob_meta = ET.SubElement(application, "meta-data")
          admob_meta.set(f"{{{android_ns}}}name", "com.google.android.gms.ads.APPLICATION_ID")
          admob_meta.set(f"{{{android_ns}}}value", "ca-app-pub-3940256099942544~3347511713")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply privacy-first Android file access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit("Android manifest not found after Capacitor sync")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(manifest)
          root = tree.getroot()
          blocked = {
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO",
              "android.permission.READ_MEDIA_VISUAL_USER_SELECTED",
          }
          removed = []
          for node in list(root):
              if node.tag.endswith("uses-permission") or node.tag.endswith("uses-permission-sdk-23"):
                  name = node.get(f"{{{android}}}name")
                  if name in blocked:
                      root.remove(node)
                      removed.append(name)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          remaining = []
          for node in root:
              if node.tag.endswith("uses-permission") or node.tag.endswith("uses-permission-sdk-23"):
                  name = node.get(f"{{{android}}}name")
                  if name in blocked:
                      remaining.append(name)
          if remaining:
              raise SystemExit("Broad media/storage permissions remain: " + ", ".join(remaining))
          print("Privacy-first file access applied. Removed broad permissions:", removed or "none present")
          print("User-selected files continue through Android's system document/photo picker.")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Use the smaller binary distribution from the direct Gradle CDN.
          # The default services.gradle.org redirect currently returns timeouts/504.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle/wrapper/gradle-wrapper.properties")
          if not p.is_file():
              raise SystemExit("Gradle wrapper properties file is missing")
          lines = [line for line in p.read_text().splitlines()
                   if not line.startswith("distributionUrl=")
                   and not line.startswith("networkTimeout=")]
          lines += [
              "distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v8.11.1/gradle-8.11.1-bin.zip",
              "networkTimeout=120000",
          ]
          p.write_text("\n".join(lines) + "\n")
          print("Gradle wrapper configured to use the Aliyun Gradle distribution mirror with 120s timeout.")
          PY
          # Prefer independent Maven Central mirrors to bypass transient 504 responses
          # from the default Maven Central -> GitHub artifact redirect.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/bilocost-maven-mirrors.gradle" <<'GRADLE'
          allprojects {
              repositories {
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  maven { url = uri("https://maven.aliyun.com/repository/central") }
              }
          }
          GRADLE
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying in 20 seconds..."
              sleep 20
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare stable APK filename
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bilocost-Android.apk

      - name: Publish Android beta APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-beta
          name: Bilocost Android beta
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: Bilocost-Android.apk
