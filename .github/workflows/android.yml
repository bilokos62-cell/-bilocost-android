name: Build Bilocost Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor and add Android
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bilocost.app",
            "appName": "Bilocost",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Install Bilocost launcher icon
        run: |
          # Remove Capacitor's default PNG launcher files to avoid duplicate
          # Android resources with the Bilocost JPG files of the same name.
          find android/app/src/main/res -path '*/mipmap-*' -type f \\
            \\( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' \\) -delete
          cp -R android-resources/app/src/main/res/. android/app/src/main/res/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<application', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
