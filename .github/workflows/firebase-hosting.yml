name: Deploy Bilocost Website to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject messaging reliability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          patch = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          listing_location = Path("listing-location.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          exchange_rates = Path("exchange-rates.js").read_text(encoding="utf-8")
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          html = html[:script_end] + "\n" + patch + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + listing_location + "\n" + ui_refinement + "\n" + exchange_rates + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging, services, and secure delivery OTP modules injected into the application script.")
          PY

      - name: Inject responsive tablet and desktop layout
        run: python3 scripts/inject-responsive-layout.py

      - name: Validate Bilocost source and integrations
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          cp responsive-layout.css www/responsive-layout.css
          # Copy the local brand assets used by the storefront.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Keep optional PWA assets available when they exist in the repository.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          test -s www/IMG-20261024-WA0000.jpg

      - name: Display file consent as a centered modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          script = r"""
          <style id="bilo-file-consent-modal-style">
          #bilo-file-consent-overlay {
            position: fixed !important; inset: 0 !important; z-index: 2147483000 !important;
            display: grid !important; place-items: center !important;
            padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)) !important;
            box-sizing: border-box !important; background: rgba(2, 8, 18, .76) !important;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
          }
          #bilo-file-consent-overlay > [data-bilo-consent-card] {
            position: relative !important; inset: auto !important; transform: none !important;
            width: min(560px, 100%) !important; max-width: 100% !important;
            max-height: min(78dvh, 680px) !important; overflow: auto !important;
            box-sizing: border-box !important; margin: auto !important;
            border-radius: 24px !important; box-shadow: 0 24px 80px rgba(0,0,0,.48) !important;
          }
          @media (max-width: 480px) {
            #bilo-file-consent-overlay { padding-left: 14px !important; padding-right: 14px !important; }
            #bilo-file-consent-overlay > [data-bilo-consent-card] { border-radius: 20px !important; }
          }
          </style>
          <script id="bilo-file-consent-modal-fix">
          (() => {
            const title = "Autorisation d'accès à vos fichiers";
            const install = () => {
              if (document.getElementById("bilo-file-consent-overlay")) return;
              const nodes = [...document.querySelectorAll("body *")].filter(el =>
                el.children.length === 0 && (el.textContent || "").trim().includes(title)
              );
              for (const heading of nodes) {
                let card = heading;
                while (card && card !== document.body) {
                  const text = (card.innerText || card.textContent || "");
                  if (text.includes("Continuer") && text.includes("Plus tard")) break;
                  card = card.parentElement;
                }
                if (!card || card === document.body) continue;
                const overlay = document.createElement("div");
                overlay.id = "bilo-file-consent-overlay";
                overlay.setAttribute("role", "presentation");
                card.setAttribute("data-bilo-consent-card", "");
                card.setAttribute("role", "dialog");
                card.setAttribute("aria-modal", "true");
                overlay.appendChild(card);
                document.body.appendChild(overlay);
                return;
              }
            };
            const start = () => {
              install();
              new MutationObserver(install).observe(document.body, {childList:true,subtree:true});
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, {once:true});
            else start();
          })();
          </script>
          """
          if "bilo-file-consent-modal-fix" not in html:
              if "</body>" not in html:
                  raise SystemExit("HTML body closing tag not found")
              html = html.replace("</body>", script + "\n</body>", 1)
          p.write_text(html, encoding="utf-8")
          print("File consent dialog is positioned as a centered modal overlay.")
          PY

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # Publish the website independently; Storage IAM permissions must not block Hosting.
          firebase deploy --only hosting --project bilocost-a8136
