name: Deploy Bilocost Website to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject messaging reliability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Expose the AI model as soon as it exists; do not wait for Auth persistence.
          old_auth = ' const auth=A.getAuth(a);'
          new_auth = ' const auth=A.getAuth(a); Object.assign(FB,{A,F,O,AC,AI,appCheck,ai,auth,db:F.getFirestore(a),st:O.getStorage(a),aiModel});'
          if old_auth not in html:
              raise SystemExit("Firebase Auth initialization point not found")
          html = html.replace(old_auth, new_auth, 1)
          old_assign = ' Object.assign(FB,{A,F,O,AC,AI,appCheck,ai,aiModel,auth,db:F.getFirestore(a),st:O.getStorage(a)})'
          if old_assign not in html:
              raise SystemExit("Original Firebase assignment not found")
          html = html.replace(old_assign, '', 1)

          # Correct the mobile header: keep wallet access inside the profile area.
          import re
          html, removed = re.subn(r'<button class="ib" data-t="wallet"[^>]*>.*?</button>', '', html, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit("Header wallet control not found; refusing an unsafe layout patch")
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          patch = Path("messaging-fix.js").read_text(encoding="utf-8")
          gemini = Path("gemini-assistant.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          html = html[:script_end] + "\n" + patch + "\n" + gemini + "\n" + services + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging patch injected into the application script.")
          PY

      - name: Validate Bilocost source and integrations
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          # Copy the local brand assets used by the storefront.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Keep optional PWA assets available when they exist in the repository.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          test -s www/IMG-20261024-WA0000.jpg

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only hosting,firestore:rules,firestore:indexes --project bilocost-a8136
