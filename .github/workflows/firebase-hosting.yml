
name: Deploy Bilocost Website to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate app JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const h=fs.readFileSync("index.html","utf8"); const a=[...h.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]).filter(x=>x.trim()); if(a.length<2) throw new Error("Application script missing"); fs.writeFileSync("/tmp/bilocost.js",a[a.length-1]);'
          node --check /tmp/bilocost.js
      - name: Prepare website
        run: |
          mkdir -p www/icons
          cp index.html www/index.html
          # Copy the local brand assets used by the storefront.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Keep optional PWA assets available when they exist in the repository.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          test -s www/IMG-20261024-WA0000.jpg

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only hosting --project bilocost-a8136
