name: Deploy Bilocost Website to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject messaging reliability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          patch = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          html = html[:script_end] + "\n" + patch + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + ui_refinement + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging, services, and secure delivery OTP modules injected into the application script.")
          PY

      - name: Validate Bilocost source and integrations
        run: npm run build

      - name: Prepare website
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          # Remove any previously registered service worker and stale origin caches.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          registration = 'if(location.protocol==="https:" && "serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(e=>console.warn("Bilocost service worker unavailable",e))})}'
          recovery = '''if("serviceWorker" in navigator){window.addEventListener("load",async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();const names=await caches.keys();if(regs.length||names.length){await Promise.all(regs.map(r=>r.unregister()));await Promise.all(names.map(n=>caches.delete(n)));if(!sessionStorage.getItem("bilo_recovery_20261107")){sessionStorage.setItem("bilo_recovery_20261107","1");location.reload()}}}catch(e){console.warn("Bilocost cache recovery",e)}})}'''
          if registration not in html:
              raise SystemExit("Expected service worker registration block not found; refusing an unsafe replacement")
          html = html.replace(registration, recovery, 1)
          if "navigator.serviceWorker.register" in html:
              raise SystemExit("A service worker registration remains in the deployed HTML")
          p.write_text(html, encoding="utf-8")
          print("Legacy service workers and stale CacheStorage entries will be cleared on the next visit.")
          PY
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp icons/icon.svg www/icons/icon.svg
          test -s www/manifest.webmanifest
          test -s www/sw.js
          test -s www/icons/icon.svg
          test -s www/IMG-20261024-WA0000.jpg

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only hosting --project bilocost-a8136
          if ! firebase deploy --only firestore:indexes --project bilocost-a8136; then
            echo "::warning::Firestore indexes were not deployed. Check the deployment service account's Firestore permissions."
          fi
          if ! firebase deploy --only firestore:rules --project bilocost-a8136; then
            echo "::warning::Firestore rules were not deployed. Grant the deployment service account the Firebase Rules Admin role, then rerun this workflow."
          fi
          npm --prefix functions install --no-audit --no-fund
          if ! firebase deploy --only functions --project bilocost-a8136; then
            echo "::warning::Cloud Functions were not deployed. Confirm that the Firebase project uses the Blaze plan and that the service account has Cloud Functions, Cloud Build, Artifact Registry, and Service Account User permissions."
          fi
