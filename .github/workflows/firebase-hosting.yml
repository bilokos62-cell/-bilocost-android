name: Deploy Bilocost Website to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/auth-forms-stable-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject messaging reliability patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          # Correct the mobile header: keep wallet access inside the profile area.
          responsive_css = """
          /* Branded Bilocost startup state; no changes to normal home or theme surfaces. */
          #view .bilo-startup-loading{
            display:flex!important;
            min-height:270px!important;
            flex-direction:column!important;
            align-items:center!important;
            justify-content:center!important;
            gap:12px!important;
            margin:28px auto!important;
            padding:34px 22px!important;
            text-align:center!important;
            background:var(--card)!important;
            border:1px solid var(--line)!important;
            border-radius:24px!important;
          }
          #view .bilo-startup-brand{display:flex;flex-direction:column;align-items:center;gap:7px;margin:0 0 4px}
          #view .bilo-startup-mark{position:relative;display:grid;place-items:center;width:84px;height:84px;margin-bottom:5px}
          #view .bilo-startup-logo{display:block;width:58px;height:58px;object-fit:contain;border-radius:15px;position:relative;z-index:2}
          #view .bilo-startup-orbit{position:absolute;inset:1px;border:3px solid var(--line);border-top-color:var(--pri);border-right-color:var(--pri);border-radius:50%;animation:biloStartupOrbit 1.6s linear infinite}
          #view .bilo-startup-brand strong{font-size:23px;line-height:1.2;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
          #view .bilo-startup-brand small{font-size:11px;line-height:1.5;color:var(--mute);letter-spacing:.025em}
          #view .bilo-startup-loading>p{max-width:420px;margin:0!important;color:var(--mute)!important}
          @keyframes biloStartupOrbit{to{transform:rotate(360deg)}}
          @media(prefers-reduced-motion:reduce){#view .bilo-startup-orbit{animation:none}}
          
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          /* Do not force min-width:0 on every descendant: it collapses intrinsic
             widths inside nested flex/grid layouts, especially on tablets. */
          #view .grid, #view .cg, #view .card, #view .bilo-home-categories,
          #view .bilo-home-trending, #view .bilo-home-services,
          #view .bilo-service-invite, #view .bilo-service-tile { min-width: 0; }
          /* Preserve normal word flow; only long unbroken strings may wrap. */
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span {
            overflow-wrap: break-word;
            word-break: normal;
          }
          /* Keep the services empty-state invitation visible; its collapsed copy was removed in PR #106. */
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\n</style>", 1)
          patch = Path("messaging-fix.js").read_text(encoding="utf-8")
          services = Path("service-design.js").read_text(encoding="utf-8")
          delivery = Path("delivery-otp.js").read_text(encoding="utf-8")
          geography = Path("geography-selector.js").read_text(encoding="utf-8")
          listing_location = Path("listing-location.js").read_text(encoding="utf-8")
          ui_refinement = Path("ui-refinement.js").read_text(encoding="utf-8")
          exchange_rates = Path("exchange-rates.js").read_text(encoding="utf-8")
          marketplace_search = Path("marketplace-search.js").read_text(encoding="utf-8")
          order_ui = Path("order-ui-fix.js").read_text(encoding="utf-8")
          startup_screen = Path("startup-screen.js").read_text(encoding="utf-8")
          home_discovery = Path("home-discovery.js").read_text(encoding="utf-8")
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          html = html[:script_end] + "\n" + patch + "\n" + services + "\n" + delivery + "\n" + geography + "\n" + listing_location + "\n" + ui_refinement + "\n" + home_discovery + "\n" + exchange_rates + "\n" + marketplace_search + "\n" + order_ui + "\n" + startup_screen + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Messaging, services, and secure delivery OTP modules injected into the application script.")
          PY

      - name: Inject responsive tablet and desktop layout
        run: python3 scripts/inject-responsive-layout.py

      - name: Validate marketplace search module syntax
        run: |
          node --check marketplace-search.js
          node --check order-ui-fix.js
          node --check startup-screen.js

      - name: Validate auth refinement syntax for preview
        run: node --check ui-refinement.js

      - name: Prepare website
        run: |
          mkdir -p www/icons www/resources www/admin
          # Publish storefront assets (including the approved homepage hero image).
          if [ -d assets ]; then mkdir -p www/assets && cp -R assets/. www/assets/; fi
          test -s www/assets/bilocost-hero-2026.webp
          cp index.html www/index.html
          cp admin/index.html www/admin/index.html
          cp responsive-layout.css www/responsive-layout.css
          # Copy the local brand assets used by the storefront.
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          # Keep optional PWA assets available when they exist in the repository.
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          test -s www/IMG-20261024-WA0000.jpg

          # Publish the device-aware download page and installable PWA assets.
          cp download.html www/download.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          mkdir -p www/icons
          cp icons/bilocost.svg www/icons/bilocost.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          head = """
          <link rel="manifest" href="/manifest.webmanifest">
          <meta name="theme-color" content="#087542">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="Bilocost">
          <link rel="apple-touch-icon" href="/icons/bilocost.svg">
          <script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js?v=4", { updateViaCache: "none" }).then(reg => reg.update()).catch(() => {}));
          }
          </script>
          """
          if 'rel="manifest"' not in html:
              if "</head>" not in html:
                  raise SystemExit("HTML head closing tag missing")
              html = html.replace("</head>", head + "\n</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy isolated preview channel
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILOCOST_A8136 }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          # Publish the website independently; Storage IAM permissions must not block Hosting.
          firebase hosting:channel:deploy auth-preview-115 --only hosting --project bilocost-a8136 --expires 7d
