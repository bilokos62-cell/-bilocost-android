name: Build Bilocost iOS Simulator

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - setup/ios-capacitor-build

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Bilocost source
        run: npm run build

      - name: Prepare shared web app
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -R icons/. www/icons/; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          responsive_css = """
          /* Bilocost responsive header and text containment */
          header { gap: 8px; min-width: 0; }
          header .logo { flex: 0 0 auto; min-width: 0; }
          header .logo b, header .logo small { white-space: nowrap; }
          header > div:last-child { flex: 0 1 auto; min-width: 0; gap: 4px !important; }
          header .ib { width: 34px; height: 34px; flex: 0 0 34px; }
          header .commune { flex: 0 1 auto; min-width: 0; max-width: 104px; padding: 7px 8px; }
          #view, #view * { min-width: 0; }
          #view p, #view h1, #view h2, #view h3, #view small, #view b, #view span { overflow-wrap: anywhere; }
          #view img { max-width: 100%; }
          @media (max-width: 390px) {
            header { padding: 10px 10px; gap: 5px; }
            header .logo { gap: 6px; }
            header .logo b { font-size: 18px; }
            header .logo small { font-size: 8px; letter-spacing: .035em; }
            header .commune { max-width: 34px; width: 34px; overflow: hidden; white-space: nowrap; padding: 7px; gap: 12px; }
            header .commune #communeLbl { display: none; }
          }
          @media (max-width: 340px) {
            header .logo img, header .logo .lg { width: 32px !important; height: 32px !important; }
            header .logo b { font-size: 16px; }
            header .logo small { font-size: 7px; }
            header .ib { width: 32px; height: 32px; flex-basis: 32px; }
          }
          """
          if "/* Bilocost responsive header and text containment */" not in html:
              if "</style>" not in html:
                  raise SystemExit("Stylesheet closing tag not found")
              html = html.replace("</style>", responsive_css + "\\n</style>", 1)
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0: raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0: raise SystemExit("Application script boundaries not found")
          modules = ["messaging-fix.js", "service-design.js", "delivery-otp.js", "geography-selector.js", "ui-refinement.js", "ios-hig.js"]
          injected = "\n".join(Path(name).read_text(encoding="utf-8") for name in modules)
          html = html[:script_end] + "\n" + injected + "\n" + html[script_end:]
          p.write_text(html, encoding="utf-8")
          print("Shared Bilocost modules injected for iOS.")
          PY

      - name: Integrate Bilocost loading screen for iOS
        run: |
          mkdir -p www
          cp resources/Bilocost_Loading_Screen.html www/bilocost-loading-screen.html
          test -s www/bilocost-loading-screen.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          script = r"""
          <script id="bilocost-native-loader-script">
          (() => {
            const cap = window.Capacitor;
            if (!cap || typeof cap.getPlatform !== "function" || cap.getPlatform() !== "ios") return;
            if (document.getElementById("bilocost-native-loader")) return;

            const layer = document.createElement("div");
            layer.id = "bilocost-native-loader";
            layer.setAttribute("role", "status");
            layer.setAttribute("aria-label", "Chargement de Bilocost");
            Object.assign(layer.style, {
              position: "fixed", inset: "0", zIndex: "2147483647",
              overflow: "hidden", background: "#072e22",
              opacity: "1", transition: "opacity 360ms ease"
            });

            const frame = document.createElement("iframe");
            frame.src = "bilocost-loading-screen.html";
            frame.title = "Écran de chargement Bilocost";
            frame.setAttribute("aria-label", "Animation de chargement Bilocost");
            frame.setAttribute("scrolling", "no");
            Object.assign(frame.style, {
              display: "block", width: "100%", height: "100%",
              border: "0", background: "#072e22"
            });
            layer.appendChild(frame);
            document.body.appendChild(layer);

            let closed = false;
            const startedAt = Date.now();
            let readySince = 0;
            const close = () => {
              if (closed) return;
              closed = true;
              layer.style.opacity = "0";
              layer.style.pointerEvents = "none";
              window.setTimeout(() => layer.remove(), 400);
            };
            const appIsReady = () => {
              const view = document.getElementById("view");
              return document.readyState !== "loading" &&
                !!view && (view.childElementCount > 0 || view.textContent.trim().length > 0);
            };
            const checkReady = () => {
              if (closed) return;
              const elapsed = Date.now() - startedAt;
              if (appIsReady()) {
                if (!readySince) readySince = Date.now();
                if (elapsed >= 1400 && Date.now() - readySince >= 500) {
                  close();
                  return;
                }
              } else {
                readySince = 0;
              }
              if (elapsed >= 10000) {
                close();
                return;
              }
              window.setTimeout(checkReady, 160);
            };
            frame.addEventListener("error", close, { once: true });
            window.setTimeout(checkReady, 100);
            window.addEventListener("pagehide", close, { once: true });
          })();
          </script>
          """
          if "bilocost-native-loader-script" not in html:
              if "</body>" not in html:
                  raise SystemExit("Body closing tag not found")
              html = html.replace("</body>", script + "\n</body>", 1)
          p.write_text(html, encoding="utf-8")
          print("New Bilocost loading screen integrated for iOS.")
          PY

      - name: Install dependencies
        run: npm install

      - name: Add and sync iOS platform
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bilocost.app",
            "appName": "Bilocost",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator build
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Bilocost-iOS-Simulator.zip

      - name: Package complete Xcode project
        run: |
          test -d ios/App
          ditto -c -k --sequesterRsrc --keepParent ios Bilocost-iOS-Xcode-Project.zip

      - name: Upload iOS build and Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-iOS-Project-and-Simulator
          path: |
            Bilocost-iOS-Simulator.zip
            Bilocost-iOS-Xcode-Project.zip
          if-no-files-found: error
