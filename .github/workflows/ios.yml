name: Build Bilocost iOS Simulator

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - '.github/workflows/android.yml'
      - '.github/workflows/ios.yml'
      - 'marketplace-search.js'
      - '*.js'

concurrency:
  group: bilocost-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Diagnose macOS runner and Xcode
        run: |
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | head -80
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inject shared Bilocost modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          marker = "const CLOUD="
          pos = html.find(marker)
          if pos < 0:
              raise SystemExit("Application script marker not found")
          script_start = html.rfind("<script", 0, pos)
          script_end = html.find("</script>", pos)
          if script_start < 0 or script_end < 0:
              raise SystemExit("Application script boundaries not found")
          modules = [
              "messaging-fix.js",
              "service-design.js",
              "delivery-otp.js",
              "geography-selector.js",
              "listing-location.js",
              "ui-refinement.js",
          ]
          additions = []
          for name in modules:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Required shared module missing: {name}")
              additions.append(path.read_text(encoding="utf-8"))
          html = html[:script_end] + "\n" + "\n".join(additions) + "\n" + html[script_end:]
          Path("index.html").write_text(html, encoding="utf-8")
          print("Shared messaging, services, delivery OTP, geography, and UI modules injected for iOS.")
          PY

      - name: Inject responsive tablet and desktop layout
        run: python3 scripts/inject-responsive-layout.py

      - name: Validate Bilocost source
        run: npm run build

      - name: Prepare web bundle
        run: |
          mkdir -p www/icons www/resources
          cp index.html www/index.html
          cp responsive-layout.css www/responsive-layout.css
          cp IMG-20261024-WA0000.jpg www/IMG-20261024-WA0000.jpg
          cp IMG-20261024-WA0000~2.jpg www/IMG-20261024-WA0000~2.jpg
          test -s www/IMG-20261024-WA0000.jpg
          # Use the same clean white splash, activated only on iOS.
          cp resources/bilocost-app-icon.jpg www/bilocost-loader-logo.jpg
          test -s www/bilocost-loader-logo.jpg
          python3 scripts/inject-ios-splash.py

      - name: Add Capacitor iOS platform
        run: |
          npm install @capacitor/ios@^7.4.3
          npx cap add ios
          python3 -m venv /tmp/bilocost-icon-venv
          /tmp/bilocost-icon-venv/bin/pip install --quiet Pillow
          /tmp/bilocost-icon-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          source = Path("resources/bilocost-app-icon.jpg")
          if not source.is_file():
              raise SystemExit("Bilocost app icon is missing: resources/bilocost-app-icon.jpg")
          image = Image.open(source).convert("RGB")
          w, h = image.size
          side = min(w, h)
          image = image.crop(((w-side)//2, (h-side)//2, (w-side)//2+side, (h-side)//2+side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          # Remove the photographed black corners and smooth the rounded contour.
          bg = image.getpixel((512, 12))
          scale = 4
          mask_hi = Image.new("L", (1024*scale, 1024*scale), 0)
          ImageDraw.Draw(mask_hi).rounded_rectangle((0, 0, 1024*scale-1, 1024*scale-1), radius=176*scale, fill=255)
          mask = mask_hi.resize((1024, 1024), Image.Resampling.LANCZOS)
          clean = Image.new("RGB", (1024, 1024), (255, 255, 255))
          clean.paste(image, (0, 0), mask)
          clean = clean.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
          clean_source = Path("/tmp/bilocost-app-icon-clean.png")
          clean.save(clean_source, optimize=True)
          folder = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          folder.mkdir(parents=True, exist_ok=True)
          specs = [
            ("20x20","2x",40),("20x20","3x",60),
            ("29x29","2x",58),("29x29","3x",87),
            ("40x40","2x",80),("40x40","3x",120),
            ("60x60","2x",120),("60x60","3x",180),
            ("76x76","1x",76),("76x76","2x",152),
            ("83.5x83.5","2x",167),
          ]
          entries = []
          for size, scale_name, px in specs:
            filename = f"bilocost-{px}.png"
            import subprocess
            subprocess.run(["sips","-s","format","png","-z",str(px),str(px),str(clean_source),"--out",str(folder/filename)],check=True,stdout=subprocess.DEVNULL)
            entries.append({"size":size,"idiom":"universal","filename":filename,"scale":scale_name})
          import subprocess
          subprocess.run(["sips","-s","format","png","-z","1024","1024",str(clean_source),"--out",str(folder/"bilocost-1024.png")],check=True,stdout=subprocess.DEVNULL)
          entries.append({"size":"1024x1024","idiom":"ios-marketing","filename":"bilocost-1024.png","scale":"1x"})
          (folder/"Contents.json").write_text(json.dumps({"images":entries,"info":{"author":"xcode","version":1}},indent=2))
          print("Clean Bilocost iOS app icon generated with antialiased contours.")
          PY
          npx cap sync ios
          test -d ios/App/App.xcworkspace

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Bilocost-iOS-Simulator-App
          path: build/ios-derived-data/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
