name: Validate Bilocost pull requests

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Protect paused startup animation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          CHANGED="$(git diff --name-only FETCH_HEAD...HEAD)"
          if printf '%s\\n' "$CHANGED" | grep -Fx -e "écran de chargement .mp4" -e "resources/13774.mp4"; then
            echo "::error::Startup animation assets are paused and protected. Do not modify them without explicit approval."
            exit 1
          fi

      - name: Validate application and backend source
        run: npm run build
