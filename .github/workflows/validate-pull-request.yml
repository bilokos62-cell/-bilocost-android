name: Validate Bilocost pull requests

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Protect paused startup animation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          if printf '%s\n' "$CHANGED" | grep -Fx -e "écran de chargement .mp4" -e "resources/13774.mp4"; then
            echo "::error::Startup animation assets are paused and protected. Do not modify them without explicit approval."
            exit 1
          fi

      - name: Validate application and backend source
        run: npm run build

  android-manifest-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate Capacitor Android project
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          npx cap sync android
      - name: Audit generated Android manifest
        run: python3 scripts/audit-android-manifest.py android/app/src/main/AndroidManifest.xml
